<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tinned Fish Passport</title>
<meta name="description" content="{{COUNT}} tins from {{BRANDS}} brands, stamped and rated.">
<meta property="og:title" content="Tinned Fish Passport"><meta property="og:image" content="img/cover.jpg">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Fish Passport">
<meta name="application-name" content="Fish Passport">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1a2b">
<style>
:root{--bg:#0d1a2b;--gold:#d8b96a;--paper:#f4eedd;--ink:#22407a;--red:#c8201a}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(ellipse at 50% 20%,#1d3352,var(--bg) 70%);color:var(--paper);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
header{text-align:center;padding:22px 16px 8px}
h1{font-weight:normal;letter-spacing:.32em;font-size:clamp(15px,3.6vw,22px);color:var(--gold);margin:0}
header p{margin:6px 0 0;opacity:.7;font-size:14px;letter-spacing:.05em}
.stage{perspective:2200px;display:flex;justify-content:center;padding:10px 12px 0}
.book{position:relative;width:min(92vw,calc((100svh - 190px)*.72),560px);aspect-ratio:900/1250;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.1,.2,1)}
.leaf.turned{transform:rotateY(-178deg)}
.front,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px 12px 12px 4px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.front img{width:100%;height:100%;display:block}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 7%,rgba(255,255,255,.04) 50%,rgba(0,0,0,.06));pointer-events:none}
.back{transform:rotateY(180deg);background:linear-gradient(90deg,#e9e1cb,#f4eedd)}
.leaf.turned{pointer-events:none}.leaf.gone{visibility:hidden}
.nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:16px}
.nav .arrow{background:none;border:1px solid rgba(216,185,106,.6);color:var(--gold);width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer}
.nav .arrow:disabled{opacity:.3}
.dot{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(244,238,221,.3);cursor:pointer}
.dot.on{background:var(--gold)}
.fsbtn{display:flex;align-items:center;gap:7px;margin:0 auto 10px;background:#13294a;border:1px solid rgba(216,185,106,.7);color:var(--gold);font:13px Georgia,serif;letter-spacing:.12em;padding:7px 14px;border-radius:18px;cursor:pointer}
.fsbtn svg{width:14px;height:14px}
.fsclose{display:none;position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;z-index:1000;background:#13294a;border:1px solid rgba(216,185,106,.7);color:var(--gold);width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
#viewer.fs{position:fixed;inset:0;z-index:999;background:#05080f;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#viewer.fs .stage{padding:8px}
#viewer.fs .book{width:min(calc(100vw - 16px),calc((100dvh - 96px)*.72))}
#viewer.fs .fsclose{display:block}#viewer.fs .fsbtn{display:none}
#viewer.fs .nav{padding:12px}
html.fslock,html.fslock body{overflow:hidden}
.hint{text-align:center;font-size:13px;opacity:.55;margin:-6px 0 10px}
section{max-width:620px;margin:34px auto 50px;padding:0 14px}
h2{color:var(--gold);font-weight:normal;letter-spacing:.25em;text-align:center;font-size:18px}
table{width:100%;border-collapse:collapse;background:var(--paper);color:#1c2a40;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
td{padding:12px 14px;border-bottom:1px solid #e0d6bd;vertical-align:middle}
td span{display:block;font-size:12px;letter-spacing:.12em;color:var(--ink);text-transform:uppercase;margin-top:3px;font-family:Helvetica,Arial,sans-serif}
td b{font-weight:600}.rk{width:44px;text-align:center;color:#8a7a55;font-size:18px}
.rt{text-align:right;color:var(--red);font-weight:bold;font-size:22px;white-space:nowrap;font-family:Helvetica,Arial,sans-serif}.rt small{font-size:12px;opacity:.7}
tr:nth-child(even) td{background:#efe7d1}
footer{text-align:center;font-size:12px;opacity:.45;padding-bottom:30px}
@media (prefers-reduced-motion:reduce){.leaf{transition:none}}
</style></head><body>
<header><h1>TINNED FISH PASSPORT</h1><p>{{COUNT}} tins · {{BRANDS}} brands</p></header>
<div id="viewer"><button class="fsclose" id="fsclose" aria-label="Exit full screen">×</button>
<div class="stage"><div class="book" id="book">
{{LEAVES}}
</div></div>
<div class="nav"><button class="arrow" id="prev" aria-label="Previous page">‹</button>{{DOTS}}<button class="arrow" id="next" aria-label="Next page">›</button></div>
</div>
<div class="hint">Tap or swipe to turn the page</div>
<button class="fsbtn" id="fsbtn" aria-label="Full screen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4"/></svg>FULL SCREEN</button>
<section id="all"><h2>ALL TINS, RANKED</h2><table>{{ROWS}}</table></section>
<script>
const leaves=[...document.querySelectorAll('.leaf')],dots=[...document.querySelectorAll('.dot')],N=leaves.length;let cur=0;
function show(i){cur=Math.max(0,Math.min(N-1,i));leaves.forEach((l,k)=>{l.classList.toggle('turned',k<cur);
 l.style.zIndex=k<cur?k:N-k;clearTimeout(l._t);if(k<cur-1)l._t=setTimeout(()=>l.classList.add('gone'),900);else l.classList.remove('gone')});
 dots.forEach((d,k)=>d.classList.toggle('on',k==cur));prev.disabled=cur==0;next.disabled=cur==N-1;history.replaceState(null,'',cur?'#p'+cur:location.pathname)}
const book=document.getElementById('book');let sx=null,sy=0,moved=false;
book.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;moved=false});
book.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))show(cur+(dx<0?1:-1));
 else if(Math.abs(dx)<10&&Math.abs(dy)<10){const r=book.getBoundingClientRect();show(cur+(e.clientX-r.left<r.width*.3?-1:1))}sx=null});
prev.onclick=()=>show(cur-1);next.onclick=()=>show(cur+1);dots.forEach((d,k)=>d.onclick=()=>show(k));
const viewer=document.getElementById('viewer'),fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
let overlay=false;
function setFs(on){viewer.classList.toggle('fs',on);document.documentElement.classList.toggle('fslock',on)}
function enterFs(){const r=viewer.requestFullscreen||viewer.webkitRequestFullscreen;
 if(r&&(document.fullscreenEnabled||document.webkitFullscreenEnabled)){Promise.resolve(r.call(viewer)).catch(()=>{overlay=true;setFs(true)})}
 else{overlay=true;setFs(true)}}
function exitFs(){if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{overlay=false;setFs(false)}}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>setFs(!!fsEl()||overlay)));
fsbtn.onclick=enterFs;fsclose.onclick=exitFs;
addEventListener('keydown',e=>{if(e.key=='Escape'&&overlay)exitFs()});
addEventListener('keydown',e=>{if(e.key=='ArrowRight')show(cur+1);if(e.key=='ArrowLeft')show(cur-1)});
const m=location.hash.match(/^#p(\d+)/);show(m?+m[1]:0);
</script></body></html>
